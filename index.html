<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set Dance Balingen – Anmeldung</title>
  <meta name="description" content="Anmeldung zum Set Dance Termin im Haus des Volkstanzens, Balingen." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="#top" class="logo">Set&nbsp;Dance<span>Balingen</span></a>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="container">
        <h1 id="headline">Set Dance in Balingen</h1>
        <p class="hero-sub" id="subheadline"></p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <p id="info-text-1"></p>
        <p id="info-text-2"></p>
      </div>
    </section>

    <section class="section section-alt">
      <div class="container">

        <!-- Schritt 1: Optionen + Kontaktdaten -->
        <div id="step-1">
          <h2>Anmeldung</h2>

          <p id="kapazitaet-hinweis" class="section-note" hidden></p>

          <div id="options-list" class="options-list"></div>

          <form id="kontakt-form" class="registration-form" novalidate>
            <div class="form-row">
              <label for="besucher">Anzahl Besucher *</label>
              <input type="number" id="besucher" name="besucher" min="1" value="1" required />
            </div>
            <div class="form-row">
              <label for="name">Name *</label>
              <input type="text" id="name" name="name" required />
            </div>
            <div class="form-row">
              <label for="email">E-Mail *</label>
              <input type="email" id="email" name="email" required />
            </div>

            <div class="summary-actions">
              <button type="button" id="abbrechen-btn" class="btn btn-secondary">Abbrechen</button>
              <button type="submit" class="btn btn-primary">Weiter</button>
            </div>
          </form>
        </div>

        <!-- Schritt 2: Übersicht -->
        <div id="step-2" hidden>
          <h2>Übersicht</h2>
          <dl id="uebersicht-daten" class="summary-list"></dl>

          <h3>Ausgewählte Optionen</h3>
          <ul id="uebersicht-optionen" class="summary-options"></ul>

          <p class="summary-total">Gesamtpreis: <strong id="gesamtpreis">0,00 €</strong></p>

          <div class="summary-actions">
            <button type="button" id="abbrechen-btn-2" class="btn btn-secondary">Abbrechen</button>
            <button type="button" id="zurueck-btn" class="btn btn-secondary">Zurück</button>
            <button type="button" id="senden-btn" class="btn btn-primary">Anmeldung senden</button>
          </div>
          <p id="form-status" class="form-status" role="status"></p>

          <div id="fallback-block" class="fallback-block" hidden>
            <p>
              Falls sich kein E-Mail-Programm geöffnet hat: Bitte sende die
              folgenden Angaben manuell per E-Mail an
              <strong id="fallback-email"></strong>.
            </p>
            <textarea id="fallback-text" class="fallback-text" rows="8" readonly></textarea>
            <button type="button" id="fallback-copy-btn" class="btn btn-secondary">Text kopieren</button>
          </div>
        </div>

      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="jahr"></span> Set Dance Balingen · <a href="admin.html">Admin</a></p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
